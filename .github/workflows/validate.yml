name: Validate

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  repository:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check shared TurboSnap runtime
        run: python3 scripts/sync_turbosnap_runtime.py --check

      - name: Run TurboSnap runtime tests
        run: node --test tests/*.test.mjs

      - name: Check generated plugin skills
        run: python3 scripts/sync_plugin_skills.py --check

      - name: Run unit tests
        run: python3 -m unittest discover -s tests -v
